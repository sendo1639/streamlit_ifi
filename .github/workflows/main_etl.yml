name: Executar Pipeline de Dados IFI

on:
  schedule:
    - cron: '0 9 * * *' # Todo dia às 06:00 AM (Horário de Brasília)
  workflow_dispatch:
    inputs:
      force_ettj:
        description: "Re-coletar os 5 dias disponíveis da ANBIMA? (--force)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Autenticação Google Cloud
        run: |
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > bq_key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/bq_key.json" >> $GITHUB_ENV

      
      - name: Manutenção - Renovação de Tabelas (evitar expiração Sandbox)
        run: python backend_etl/scripts/macro/renovar_tabelas_bigquery.py

      - name: ETL 1 - Macroeconômico (BCB)
        run: python backend_etl/scripts/macro/etl_bcb.py

      - name: ETL 2 - Fiscal (RTN)
        run: python backend_etl/scripts/fiscal/etl_rtn.py

      - name: ETL 3 - Social Mensal (Replace)
        continue-on-error: true
        run: python backend_etl/scripts/social/etl_social.py

      - name: ETL 4 - Social Histórico (Append)
        continue-on-error: true
        run: python backend_etl/scripts/social/etl_historico_pab_ae.py

      # ------------------------------------------------------------------
      # ETL 5 — Curva de Juros ETTJ (ANBIMA)
      # Coleta incremental: só processa os dias úteis ainda não gravados.
      # Usa --force quando acionado manualmente com a opção marcada.
      # Nota de timing: a ANBIMA publica após o fechamento (~18h-19h BRT).
      # Como a janela disponível é de 5 dias úteis, às 6h BRT os dados de
      # ontem já estão disponíveis com folga.
      # ------------------------------------------------------------------
      - name: ETL 5 - Curva de Juros ETTJ (ANBIMA)
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_ettj }}" == "true" ]; then
            FORCE_FLAG="--force"
          fi
          python backend_etl/scripts/macro/etl_anbima.py $FORCE_FLAG

      - name: Remover credenciais
        if: always()
        run: rm -f bq_key.json